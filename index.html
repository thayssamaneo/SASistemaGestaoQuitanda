<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Quitanda MVC</h1>

  <!-- Formulário para cadastrar produto -->
  <div class="container">
    <h2>Cadastrar Produto</h2>
    <h1>Adicione os campos requisitados e confirme a adição do produto</h1>
    <div class="form-area">
        <div class="form-area-align">
            <input type="text" id="nome" placeholder="Nome do produto">
            <input type="text" id="categoria" placeholder="Categoria">
            <input type="number" id="preco" placeholder="Preço unitário">
            <input type="number" id="quantidade" placeholder="Quantidade em estoque">
        </div>
        <div class="insersao_de_dados">
            <button id="btnCadastrar">Cadastrar</button>
        </div>
    </div>
  </div>


  <div class="container section-margin">
    <h2>Atualizar Produto</h2>
    <h1>Adicione os campos requisitados e confirme a atualização do produto</h1>
    <div class="form-area">
        <div class="form-area-align">
            <input type="text" id="nomeUpdate" placeholder="Nome do produto">
            
            <input type="number" id="precoUpdate" placeholder="Preço unitário">
            <input type="number" id="quantidadeUpdate" placeholder="Quantidade em estoque">
        </div>
        <div class="insersao_de_dados">
            <button id="btnUpdate">Atualizar</button>
        </div>
    </div>
</div>

<div class="container section-margin">
    <div class="linhas">
        <div class="action-group">
            <h2>Estoque</h2>
            <button class="btn-secondary" id="btnListarEstoque">Listar Estoque</button>
            <div id="estoque"></div> </div>
        <div class="action-group">
            <h2>Movimentações</h2>
            <button class="btn-secondary" id="btnListarMov">Listar Movimentações</button>
            <div id="movimentacoes"></div> </div>
    </div>
</div>

<div class="container section-margin">
    <h2>Registrar Venda</h2>
    <div class="form-area">
        <div class="form-area-align">
            <input type="text" id="nomeVenda" placeholder="Nome do Produto">
            <input type="number" id="quantidadeVenda" placeholder="Quantidade">
            <button id="btnVenda">Registrar Venda</button>
        </div>
    </div>
</div>

<div id="mensagens" style="text-align: center; margin-top: 20px; font-weight: bold; color: dodgerblue;"></div>


    <script type="module" src="./js/main.js"></script>
</body>
</html>
